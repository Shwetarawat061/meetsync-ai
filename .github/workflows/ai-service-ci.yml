name: AI Service CI

on:
  push:
    branches:
      - main
      - feature/development
      - feature/fastapi-service-scaffold
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  workflow_dispatch:

jobs:
  ai-service:
    name: AI Service tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      MEETSYNC_USE_LOCAL_EMBEDDINGS: "1"
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run AI service unit tests
        run: pytest app/ -v --tb=short

      - name: Run regression tests against fixtures
        run: pytest app/intelligence/tests/test_regression.py -v --tb=short

      - name: Run MoM API tests
        run: pytest app/internal_ai/tests/test_mom_api.py -v --tb=short

      - name: Run decision and skill-match tests
        run: pytest app/internal_ai/tests/test_decisions_api.py -v --tb=short

      - name: Lint with pylint (warnings only)
        run: |
          pip install pylint
          pylint app/ --exit-zero --disable=all --enable=E,F || true
