name: AI Service CI

on:
  push:
    branches: [ main, feature/development, feature/fastapi-service-scaffold ]
  pull_request:
    branches: [ main ]

jobs:
  ai-service-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install Python Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run AI Service Unit Tests
        run: pytest app/ -v --tb=short

      - name: Run Regression Tests Against Fixtures
        run: pytest app/intelligence/tests/test_regression.py -v --tb=short
        env:
          MEETSYNC_USE_LOCAL_EMBEDDINGS: "1"

      - name: Run MoM API Tests
        run: pytest app/internal_ai/tests/test_mom_api.py -v --tb=short
        env:
          MEETSYNC_USE_LOCAL_EMBEDDINGS: "1"

      - name: Run Decision/Skill-Match Tests
        run: pytest app/internal_ai/tests/test_decisions_api.py -v --tb=short
        env:
          MEETSYNC_USE_LOCAL_EMBEDDINGS: "1"

      - name: Lint with pylint (warnings only)
        run: |
          pip install pylint
          pylint app/ --exit-zero --disable=all --enable=E,F || true