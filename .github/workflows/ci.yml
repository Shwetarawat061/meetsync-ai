name: CI Pipeline

on:
  push:
    branches: [ main, feature/development ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/meetsync_test
      JWT_SECRET: ci-test-secret-at-least-32-chars!!
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/meetsync_test
          JWT_SECRET: ci-test-secret-at-least-32-chars!!

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/meetsync_test
          JWT_SECRET: ci-test-secret-at-least-32-chars!!
          AI_USE_MOCKS: "true"

      - name: Run Resilience Tests
        run: npm run test:resilience
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/meetsync_test
          JWT_SECRET: ci-test-secret-at-least-32-chars!!