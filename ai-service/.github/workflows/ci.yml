name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Tell GitHub to run all following commands inside the ai-service folder
    defaults:
      run:
        working-directory: ./ai-service 

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Changed to 3.11 to match what your project was using in the logs!
          cache: pip
          
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      
      # The PYTHONPATH variable ensures Python can find your 'app' folder
      - name: Run Tests
        env:
          PYTHONPATH: .
        run: python -m pytest